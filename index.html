<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Impulsa · Parte de Trabajo</title>
<style>
  :root {
    --header: #212121; --accent: #D36846; --row-light: #F2F4E9; --row-dark: #E5E8D5;
    --green: #3C8C3C; --amber: #D8A24A; --border: #d1d5db; --text: #1a1a1a; --muted: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f3f4f6; color: var(--text); }

  /* ══ FORM ══ */
  .form-wrap { max-width: 540px; margin: 0 auto; padding: 12px; }
  .form-header { background: var(--header); color: #fff; padding: 20px; border-radius: 14px 14px 0 0; }
  .form-header-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; opacity: .65; margin-bottom: 4px; }
  .form-header h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .form-header p { font-size: 12px; opacity: .65; margin-top: 3px; }
  .accent-bar { height: 4px; background: var(--accent); }
  .form-body { background: #fff; padding: 24px 20px; border-radius: 0 0 14px 14px; border: 1px solid var(--border); border-top: none; }
  .section-label { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 1.2px; text-transform: uppercase; padding-bottom: 6px; border-bottom: 2px solid var(--accent); margin: 24px 0 16px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
  .field label .req { color: var(--accent); }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: #fff; -webkit-appearance: none;
  }
  .field textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(211,104,70,.15); }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .error-box { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: #991b1b; display: none; }

  .photo-btn { width: 100%; padding: 16px; border: 2px dashed var(--border); border-radius: 10px; background: #fafafa; color: var(--muted); font-size: 15px; cursor: pointer; text-align: center; }
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .photo-card { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .photo-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .photo-card input { width: 100%; padding: 6px 8px; font-size: 12px; border: none; border-top: 1px solid var(--border); font-family: inherit; }
  .photo-card .remove { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none; font-size: 16px; cursor: pointer; line-height: 26px; text-align: center; }

  .sig-wrap { position: relative; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: #fafafa; margin-bottom: 4px; touch-action: none; }
  .sig-wrap.signed { border-color: var(--green); }
  .sig-canvas { width: 100%; height: 130px; display: block; cursor: crosshair; touch-action: none; }
  .sig-ph { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #bbb; font-size: 13px; pointer-events: none; }
  .sig-clear { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px 0; }

  .actions { display: flex; gap: 12px; margin-top: 28px; }
  .btn-primary { flex: 1; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn-secondary { padding: 15px 18px; background: #f3f4f6; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; cursor: pointer; }

  /* ══ REPORT (on screen) ══ */
  #reportView { display: none; max-width: 800px; margin: 0 auto; padding: 12px; }
  #reportView.active { display: block; }
  .rpt-actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .rpt-actions button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-back { background: var(--header); color: #fff; }
  .btn-print { background: var(--accent); color: #fff; }
  .btn-hint { font-size: 12px; color: var(--muted); padding: 8px 0; width: 100%; }

  .report { background: #fff; border: 1px solid #ddd; overflow: hidden; }
  .rpt-hd { background: #212121; color: #fff; padding: 14px 22px; }
  .rpt-hd-title { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
  .rpt-hd-sub { font-size: 11px; opacity: .75; margin-top: 2px; }
  .rpt-bar { height: 4px; background: #D36846; }
  .rpt-body { padding: 22px 28px; }
  .rpt-ey { font-size: 10px; color: #D36846; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
  .rpt-t { font-size: 24px; font-weight: 700; margin: 0 0 10px; border-left: 4px solid #D36846; padding-left: 12px; }
  .rpt-meta { display: flex; justify-content: space-between; font-size: 11px; color: #666; border-top: 1px solid #d1d5db; padding-top: 8px; margin-bottom: 22px; }
  .rpt-h2 { font-size: 16px; font-weight: 700; margin: 22px 0 6px; }
  .rpt-line { border-top: 3px solid #D36846; margin-bottom: 10px; }

  .rpt-tbl { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  .rpt-tbl td { padding: 7px 12px; font-size: 12px; vertical-align: top; }
  .rpt-tbl .lb { background: #212121; color: #fff; font-weight: 600; width: 150px; }
  .rpt-tbl tr:nth-child(odd) td:not(.lb) { background: #F2F4E9; }
  .rpt-tbl tr:nth-child(even) td:not(.lb) { background: #E5E8D5; }

  .rpt-task-hd { background: #212121; color: #fff; padding: 8px 14px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; }
  .rpt-chip { background: #D36846; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .rpt-task { display: flex; justify-content: space-between; padding: 7px 14px; font-size: 12px; border-bottom: 1px solid #e5e7eb; }
  .rpt-task:nth-child(odd) { background: #F2F4E9; }
  .rpt-task:nth-child(even) { background: #E5E8D5; }
  .rpt-done { color: #3C8C3C; font-weight: 700; }

  .rpt-desc { background: #F2F4E9; padding: 14px 18px; border-radius: 4px; margin-bottom: 18px; font-size: 13px; line-height: 1.6; border-left: 3px solid #D36846; white-space: pre-wrap; }

  .rpt-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .rpt-ph-card { border: 1px solid #d1d5db; border-radius: 4px; overflow: hidden; break-inside: avoid; }
  .rpt-ph-card img { width: 100%; height: 200px; object-fit: contain; background: #f5f5f5; display: block; border-left: 4px solid #D36846; }
  .rpt-ph-cap { padding: 6px 10px; font-size: 10px; color: #666; font-style: italic; text-align: center; background: #F2F4E9; }

  .rpt-sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 18px; }
  .rpt-sig-box { text-align: center; }
  .rpt-sig-img { height: 70px; border: 1px solid #d1d5db; border-radius: 4px; background: #fafafa; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .rpt-sig-img img { max-height: 60px; max-width: 90%; }
  .rpt-sig-nm { font-size: 12px; font-weight: 600; }
  .rpt-sig-rl { font-size: 10px; color: #666; }
  .rpt-obs { padding: 10px 16px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; background: #f0fdf4; border-left: 4px solid #3C8C3C; }
  .rpt-footer { border-top: 1px solid #d1d5db; padding-top: 10px; font-size: 9px; color: #666; text-align: center; margin-top: 30px; }

  /* ══ PRINT ══ */
  @media print {
    body { background: #fff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .form-wrap, .rpt-actions, .btn-hint { display: none !important; }
    #reportView { display: block !important; padding: 0 !important; max-width: none !important; }
    .report { border: none !important; box-shadow: none !important; }
    .rpt-hd { background: #212121 !important; color: #fff !important; }
    .rpt-bar { background: #D36846 !important; }
    .rpt-tbl .lb { background: #212121 !important; color: #fff !important; }
    .rpt-tbl tr:nth-child(odd) td:not(.lb) { background: #F2F4E9 !important; }
    .rpt-tbl tr:nth-child(even) td:not(.lb) { background: #E5E8D5 !important; }
    .rpt-task-hd { background: #212121 !important; color: #fff !important; }
    .rpt-chip { background: #D36846 !important; color: #fff !important; }
    .rpt-task:nth-child(odd) { background: #F2F4E9 !important; }
    .rpt-task:nth-child(even) { background: #E5E8D5 !important; }
    .rpt-done { color: #3C8C3C !important; }
    .rpt-desc { background: #F2F4E9 !important; border-left: 3px solid #D36846 !important; }
    .rpt-obs { background: #f0fdf4 !important; border-left: 4px solid #3C8C3C !important; }
    .rpt-ph-card img { border-left: 4px solid #D36846 !important; }
    .rpt-ph-cap { background: #F2F4E9 !important; }
    .rpt-line { border-top: 3px solid #D36846 !important; }
    img { max-width: 100% !important; }
    .rpt-photos { break-inside: avoid; }
    .rpt-ph-card { break-inside: avoid; }
    .rpt-sig-grid { break-inside: avoid; }
    @page { margin: 10mm 12mm; size: A4; }
  }
</style>
</head>
<body>

<!-- ═══ FORM ═══ -->
<div id="formView" class="form-wrap">
  <div class="form-header">
    <div class="form-header-eyebrow">IMPULSA NETWORK</div>
    <h1>Parte de Trabajo</h1>
    <p>Formulario de campo para técnicos</p>
  </div>
  <div class="accent-bar"></div>
  <div class="form-body">
    <div id="errorBox" class="error-box"></div>

    <div class="section-label" style="margin-top:0">Datos del servicio</div>
    <div class="field"><label>Nº de Orden (SO) <span class="req">*</span></label><input id="soNumber" placeholder="SO######"></div>
    <div class="field"><label>Cliente / Marca <span class="req">*</span></label><input id="client" placeholder="Ej: Armani Exchange"></div>
    <div class="field"><label>Tienda</label><input id="store" placeholder="Ej: London · Regent St."></div>
    <div class="field"><label>Dirección <span class="req">*</span></label><input id="address" placeholder="Dirección completa"></div>
    <div class="row">
      <div class="field"><label>Fecha</label><input type="date" id="dateField"></div>
      <div class="field"><label>Tipo</label>
        <select id="serviceType"><option>Correctivo</option><option>Preventivo</option><option>Inspección</option><option>Emergencia</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Hora inicio</label><input type="time" id="startTime"></div>
      <div class="field"><label>Hora fin</label><input type="time" id="endTime"></div>
    </div>

    <div class="section-label">Descripción de los trabajos</div>
    <div class="field"><label>Trabajos realizados <span class="req">*</span></label><textarea id="description" placeholder="Describe trabajos realizados, hallazgos, materiales…"></textarea></div>

    <div class="section-label">Tareas (opcional)</div>
    <div id="taskList"></div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input id="newTask" placeholder="Añadir tarea…" style="flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;">
      <button onclick="addTask()" style="padding:10px 16px;background:var(--header);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;">+</button>
    </div>

    <div class="section-label">Personal</div>
    <div class="field"><label>Nombre del técnico <span class="req">*</span></label><input id="techName" placeholder="Nombre completo"></div>
    <div class="field"><label>Encargado/a de tienda</label><input id="managerName" placeholder="Nombre completo"></div>

    <div class="section-label">Fotos</div>
    <div class="field">
      <input type="file" id="photoInput" accept="image/*" multiple capture="environment" style="display:none" onchange="handlePhotos(this)">
      <button class="photo-btn" onclick="document.getElementById('photoInput').click()">📷 Tomar foto o seleccionar de galería</button>
      <div id="photoGrid" class="photo-grid"></div>
    </div>

    <div class="section-label">Firmas</div>
    <div class="field">
      <label>Firma del técnico</label>
      <div class="sig-wrap" id="swTech"><canvas class="sig-canvas" id="scTech"></canvas><div class="sig-ph" id="spTech">Firmar aquí</div></div>
      <button class="sig-clear" onclick="clearSig('Tech')">Borrar firma</button>
    </div>
    <div class="field">
      <label>Firma del encargado/a</label>
      <div class="sig-wrap" id="swMgr"><canvas class="sig-canvas" id="scMgr"></canvas><div class="sig-ph" id="spMgr">Firmar aquí</div></div>
      <button class="sig-clear" onclick="clearSig('Mgr')">Borrar firma</button>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="showReport()">Generar Reporte →</button>
      <button class="btn-secondary" onclick="resetForm()">Limpiar</button>
    </div>
  </div>
</div>

<!-- ═══ REPORT VIEW ═══ -->
<div id="reportView">
  <div class="rpt-actions">
    <button class="btn-back" onclick="backToForm()">← Volver</button>
    <button class="btn-print" onclick="window.print()">📄 Guardar como PDF</button>
  </div>
  <div class="btn-hint">💡 Al pulsar "Guardar como PDF", selecciona <strong>"Guardar como PDF"</strong> como destino en el diálogo de impresión.</div>
  <div class="report" id="reportContent"></div>
</div>

<script>
let photos = [];
let tasks = [];
const sigs = { Tech: { on: false, has: false }, Mgr: { on: false, has: false } };

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dateField').value = new Date().toISOString().split('T')[0];
  initSig('Tech'); initSig('Mgr');
  document.getElementById('newTask').addEventListener('keydown', e => { if (e.key==='Enter') addTask(); });
});

// ── SIGNATURE ──
function initSig(id) {
  const c = document.getElementById('sc'+id);
  const r = c.getBoundingClientRect();
  c.width = r.width*2; c.height = r.height*2;
  const x = c.getContext('2d');
  x.scale(2,2); x.strokeStyle='#1a1a1a'; x.lineWidth=2; x.lineCap='round'; x.lineJoin='round';
  const pos = e => { const r=c.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  const st = e => { e.preventDefault(); const p=pos(e); x.beginPath(); x.moveTo(p.x,p.y); sigs[id].on=true; sigs[id].has=true; document.getElementById('sp'+id).style.display='none'; document.getElementById('sw'+id).classList.add('signed'); };
  const mv = e => { if(!sigs[id].on) return; e.preventDefault(); const p=pos(e); x.lineTo(p.x,p.y); x.stroke(); };
  const en = e => { if(sigs[id].on){e.preventDefault(); sigs[id].on=false;} };
  c.addEventListener('mousedown',st); c.addEventListener('mousemove',mv); c.addEventListener('mouseup',en); c.addEventListener('mouseleave',en);
  c.addEventListener('touchstart',st,{passive:false}); c.addEventListener('touchmove',mv,{passive:false}); c.addEventListener('touchend',en,{passive:false});
}
function clearSig(id) {
  const c=document.getElementById('sc'+id), x=c.getContext('2d'), r=c.getBoundingClientRect();
  x.clearRect(0,0,r.width,r.height); sigs[id].has=false;
  document.getElementById('sp'+id).style.display='';
  document.getElementById('sw'+id).classList.remove('signed');
}
function sigData(id) { return sigs[id].has ? document.getElementById('sc'+id).toDataURL('image/png') : null; }

// ── PHOTOS ──
function handlePhotos(input) {
  Array.from(input.files).forEach(f => {
    const rd = new FileReader();
    rd.onload = e => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas');
        const M=1200; let w=img.width, h=img.height;
        if(w>M||h>M){const r=Math.min(M/w,M/h);w*=r;h*=r;}
        cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        photos.push({data:cv.toDataURL('image/jpeg',0.75), caption:''});
        renderPhotos();
      };
      img.src = e.target.result;
    };
    rd.readAsDataURL(f);
  });
  input.value='';
}
function renderPhotos() {
  document.getElementById('photoGrid').innerHTML = photos.map((p,i)=>`
    <div class="photo-card"><img src="${p.data}">
    <input type="text" placeholder="Pie de foto…" value="${p.caption}" onchange="photos[${i}].caption=this.value">
    <button class="remove" onclick="photos.splice(${i},1);renderPhotos()">×</button></div>`).join('');
}

// ── TASKS ──
function addTask() {
  const inp=document.getElementById('newTask'), v=inp.value.trim();
  if(!v) return; tasks.push(v); inp.value=''; renderTasks();
}
function renderTasks() {
  document.getElementById('taskList').innerHTML = tasks.map((t,i)=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;background:var(--row-light);border-radius:6px;">
      <span style="flex:1;font-size:14px;">▸ ${t}</span>
      <button onclick="tasks.splice(${i},1);renderTasks()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:16px;font-weight:700;">×</button>
    </div>`).join('');
}

// ── VALIDATE ──
function validate() {
  const req=[['soNumber','Nº de Orden'],['client','Cliente'],['address','Dirección'],['description','Descripción'],['techName','Técnico']];
  const miss=req.filter(([id])=>!document.getElementById(id).value.trim()).map(([,l])=>l);
  const box=document.getElementById('errorBox');
  if(miss.length){box.innerHTML='<strong>Campos obligatorios: </strong>'+miss.join(', ');box.style.display='block';box.scrollIntoView({behavior:'smooth',block:'center'});return false;}
  box.style.display='none'; return true;
}

function v(id){return document.getElementById(id).value.trim();}

// ── BUILD & SHOW REPORT ──
function showReport() {
  if(!validate()) return;

  const so=v('soNumber'), cl=v('client'), st=v('store')||'—', ad=v('address');
  const dt=v('dateField')||new Date().toISOString().split('T')[0];
  const t1=v('startTime')||'—', t2=v('endTime')||'—';
  const tp=document.getElementById('serviceType').value;
  const ds=v('description'), tn=v('techName'), mn=v('managerName')||'—';
  const ts=sigData('Tech'), ms=sigData('Mgr');
  const dp=dt.split('-'), dn=dp.length===3?`${dp[2]}/${dp[1]}/${dp[0]}`:dt;

  let n=1, h='';

  // Header
  h+=`<div class="rpt-hd"><div class="rpt-hd-title">IMPULSA NETWORK SL</div>
    <div class="rpt-hd-sub">Corrective Service Report · ${cl} ${st!=='—'?st:''} · Ref. ${so}</div></div>
    <div class="rpt-bar"></div><div class="rpt-body">
    <div class="rpt-ey">IMPULSA NETWORK SL · CORRECTIVE REPORT</div>
    <div class="rpt-t">Service Report</div>
    <div class="rpt-meta"><span>${cl} · ${st} · Ref. ${so}</span><span>${dn}</span></div>`;

  // Service Details
  h+=`<div class="rpt-h2">${n++}. Service Details</div><div class="rpt-line"></div>
    <table class="rpt-tbl">
      <tr><td class="lb">Work order no.</td><td>${so}</td><td class="lb">Service type</td><td>${tp}</td></tr>
      <tr><td class="lb">Client</td><td>${cl}</td><td class="lb">Store</td><td>${st}</td></tr>
      <tr><td class="lb">Address</td><td colspan="3">${ad}</td></tr>
      <tr><td class="lb">Date</td><td>${dn}</td><td class="lb">Period</td><td>${t1} – ${t2}</td></tr>
      <tr><td class="lb">Technician</td><td>${tn}</td><td class="lb">Store contact</td><td>${mn}</td></tr>
      <tr><td class="lb">Executing company</td><td colspan="3">Impulsa Network, S.L. · VAT B01853274</td></tr>
    </table>`;

  // Tasks
  if(tasks.length){
    h+=`<div class="rpt-h2">${n++}. Tasks Performed</div><div class="rpt-line"></div>
      <div class="rpt-task-hd"><span><span class="rpt-chip">${dn}</span>&nbsp;&nbsp;TASK PERFORMED</span><span>STATUS</span></div>`;
    tasks.forEach(t=>{h+=`<div class="rpt-task"><span>▸ ${t}</span><span class="rpt-done">DONE ✓</span></div>`;});
    h+='<div style="margin-bottom:18px;"></div>';
  }

  // Description
  h+=`<div class="rpt-h2">${n++}. Work Performed</div><div class="rpt-line"></div>
    <div class="rpt-desc">${ds.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>`;

  // Photos
  if(photos.length){
    h+=`<div class="rpt-h2">${n++}. Photographic Evidence</div><div class="rpt-line"></div><div class="rpt-photos">`;
    photos.forEach(p=>{
      h+=`<div class="rpt-ph-card"><img src="${p.data}">`;
      if(p.caption) h+=`<div class="rpt-ph-cap">${p.caption}</div>`;
      h+='</div>';
    });
    h+='</div>';
  }

  // Observations
  h+=`<div class="rpt-h2">${n++}. Observations and Closing</div><div class="rpt-line"></div>
    <div class="rpt-obs"><strong>Final status:</strong> Works completed. Equipment operational.</div>`;

  // Signatures
  h+=`<div class="rpt-h2">${n++}. Signatures</div><div class="rpt-line"></div>
    <div class="rpt-sig-grid">
      <div class="rpt-sig-box"><div class="rpt-sig-img">${ts?`<img src="${ts}">`:'<span style="color:#ccc;font-size:11px;">—</span>'}</div><div class="rpt-sig-nm">${tn}</div><div class="rpt-sig-rl">Technician</div></div>
      <div class="rpt-sig-box"><div class="rpt-sig-img">${ms?`<img src="${ms}">`:'<span style="color:#ccc;font-size:11px;">—</span>'}</div><div class="rpt-sig-nm">${mn}</div><div class="rpt-sig-rl">Store Manager</div></div>
    </div>`;

  h+=`<div class="rpt-footer">Impulsa Network, S.L. · VAT: B01853274 · www.impulsa-eu.com · External / client use</div></div>`;

  document.getElementById('reportContent').innerHTML = h;
  document.getElementById('formView').style.display = 'none';
  document.getElementById('reportView').classList.add('active');
  window.scrollTo({top:0});
}

function backToForm() {
  document.getElementById('reportView').classList.remove('active');
  document.getElementById('formView').style.display = '';
}

function resetForm() {
  if(!confirm('¿Borrar todos los datos?')) return;
  ['soNumber','client','store','address','description','techName','managerName','startTime','endTime'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('dateField').value=new Date().toISOString().split('T')[0];
  document.getElementById('serviceType').value='Correctivo';
  photos=[];renderPhotos();tasks=[];renderTasks();clearSig('Tech');clearSig('Mgr');
  document.getElementById('errorBox').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
